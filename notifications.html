<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand fw-bold" href="/">🍱 FoodShare</a>
<a href="javascript:history.back()" class="btn btn-light btn-sm">Back</a></div></nav>
<div class="container mt-5"><h2>Notifications</h2><p class="text-muted">Updates about your FoodShare activity.</p>
{% if notifications %}{% for n in notifications %}<div class="card mb-2 shadow-sm {% if not n.is_read %}border-success{% endif %}"><div class="card-body d-flex justify-content-between align-items-center">
<div><span class="badge bg-success me-2">{{ n.notification_type }}</span>{{ n.message }}<div class="small text-muted mt-1">{{ n.created_at }}</div></div>
{% if not n.is_read %}<form method="POST" action="/notifications/{{ n.id }}/read"><button class="btn btn-outline-success btn-sm">Mark read</button></form>{% endif %}
</div></div>{% endfor %}{% else %}<div class="alert alert-info">No notifications yet.</div>{% endif %}
</div></body></html>
